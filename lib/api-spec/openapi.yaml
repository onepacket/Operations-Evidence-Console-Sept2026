openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: identity
    description: Signed-in user and organisation context.
  - name: dashboard
    description: Organisation-level operational overview.
  - name: runs
    description: Import runs, validation exceptions, and evidence summaries.
  - name: actions
    description: Follow-up action requests and administrator approvals.
  - name: audit
    description: Immutable organisation audit trail.
  - name: settings
    description: Organisation settings.
  - name: storage
    description: Private object storage upload and serving endpoints.
  - name: integrations
    description: Signed inbound events and scheduled processing.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getCurrentUser
      tags: [identity]
      summary: Get signed-in user context
      responses:
        "200":
          description: Current user and organisation context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get the organisation dashboard
      responses:
        "200":
          description: Dashboard metrics and recent runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: List import runs
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RunStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Organisation-scoped import runs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Run"
    post:
      operationId: createRun
      tags: [runs]
      summary: Create a queued import run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunInput"
      responses:
        "201":
          description: Queued import run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          description: Invalid file metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /runs/{runId}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Get an import run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Import run detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetail"
        "404":
          description: Run not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /runs/{runId}/process:
    post:
      operationId: processRun
      tags: [runs]
      summary: Process a queued import run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202":
          description: Run processing accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "409":
          description: Run cannot be processed in its current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: File or input shape failed permanent validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Transient processing failure that may be retried.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /runs/{runId}/exceptions:
    get:
      operationId: listRunExceptions
      tags: [runs]
      summary: List validation exceptions for a run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Validation exceptions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ValidationException"
  /runs/{runId}/summary:
    get:
      operationId: getRunSummary
      tags: [runs]
      summary: Get the structured evidence summary
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Summary detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceSummary"
        "404":
          description: Summary not generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: generateRunSummary
      tags: [runs]
      summary: Generate a structured summary using the LLM
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SummaryInput"
      responses:
        "201":
          description: Generated evidence summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceSummary"
        "409":
          description: Run is not ready for summarisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /actions:
    get:
      operationId: listActions
      tags: [actions]
      summary: List follow-up actions
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [requested, approved, rejected, running, completed, failed]
      responses:
        "200":
          description: Organisation-scoped actions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActionRequest"
    post:
      operationId: requestAction
      tags: [actions]
      summary: Request a follow-up action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionRequestInput"
      responses:
        "201":
          description: Action awaiting administrator approval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionRequest"
  /actions/{actionId}/approve:
    post:
      operationId: approveAction
      tags: [actions]
      summary: Approve and run a follow-up action
      parameters:
        - $ref: "#/components/parameters/ActionId"
      responses:
        "200":
          description: Approved action result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionRequest"
        "403":
          description: Administrator role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /actions/{actionId}/reject:
    post:
      operationId: rejectAction
      tags: [actions]
      summary: Reject a follow-up action
      parameters:
        - $ref: "#/components/parameters/ActionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionDecisionInput"
      responses:
        "200":
          description: Rejected action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionRequest"
  /audit:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: List the organisation audit trail
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Immutable audit events.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get organisation settings
      responses:
        "200":
          description: Organisation settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update organisation settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated organisation settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationSettings"
        "403":
          description: Administrator role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for a private upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
  /webhooks/inbound:
    post:
      operationId: receiveInboundEvent
      tags: [integrations]
      summary: Receive a signed external event
      description: |
        Sign the exact UTF-8 request-body bytes with HMAC-SHA256 using
        `INBOUND_WEBHOOK_SECRET`. The signed message is
        `<unix timestamp>.<source>.<raw request body>` and the signature header
        contains the lowercase hexadecimal digest.
      parameters:
        - name: x-operations-signature
          in: header
          required: true
          schema:
            type: string
        - name: x-operations-timestamp
          in: header
          required: true
          schema:
            type: integer
        - name: x-operations-delivery
          in: header
          required: true
          schema:
            type: string
        - name: x-operations-source
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboundEventInput"
      responses:
        "202":
          description: Event accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundEventResponse"
        "401":
          description: Missing or invalid signature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "408":
          description: Declared timestamp is outside the five-minute window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Source and external event id were already received.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /jobs/process-imports:
    post:
      operationId: runImportJob
      tags: [integrations]
      summary: Claim and process queued imports for an organisation
      parameters:
        - name: x-operations-job-token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "200":
          description: Idempotent job result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "401":
          description: Invalid job credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActionId:
      name: actionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Role:
      type: string
      enum: [analyst, administrator, auditor]
    RunStatus:
      type: string
      enum: [queued, running, succeeded, failed, partial]
    CurrentUser:
      type: object
      required: [id, name, email, role, organisation]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        organisation:
          $ref: "#/components/schemas/Organisation"
    Organisation:
      type: object
      required: [id, name, code]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
    Dashboard:
      type: object
      required: [openExceptions, runsThisMonth, pendingActions, successRate, recentRuns]
      properties:
        openExceptions: { type: integer }
        runsThisMonth: { type: integer }
        pendingActions: { type: integer }
        successRate: { type: number, format: float }
        recentRuns:
          type: array
          items:
            $ref: "#/components/schemas/Run"
    Run:
      type: object
      required: [id, fileName, fileType, status, recordCount, exceptionCount, retryCount, createdAt, summaryStatus]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        fileType: { type: string }
        status: { $ref: "#/components/schemas/RunStatus" }
        recordCount: { type: integer }
        exceptionCount: { type: integer }
        retryCount: { type: integer }
        createdAt: { type: string, format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        summaryStatus:
          type: string
          enum: [not_started, generating, ready, failed]
    ImportRow:
      type: object
      required: [id, runId, rowNumber, accepted, data, createdAt]
      properties:
        id: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        rowNumber: { type: integer }
        accepted: { type: boolean }
        data: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    RunAttempt:
      type: object
      required: [id, actor, startedAt, outcome]
      properties:
        id: { type: string }
        actor: { type: string }
        startedAt: { type: string, format: date-time }
        durationMs: { type: integer, minimum: 0 }
        outcome: { type: string }
        reason: { type: ["string", "null"] }
    RunDetail:
      allOf:
        - $ref: "#/components/schemas/Run"
        - type: object
          required: [acceptedRows, rejectedRows, attempts]
          properties:
            acceptedRows:
              type: array
              items: { $ref: "#/components/schemas/ImportRow" }
            rejectedRows:
              type: array
              items: { $ref: "#/components/schemas/ImportRow" }
            attempts:
              type: array
              items: { $ref: "#/components/schemas/RunAttempt" }
    RunInput:
      type: object
      required: [fileName, fileType, fileSize, objectPath]
      properties:
        fileName: { type: string, minLength: 1 }
        fileType: { type: string, minLength: 1 }
        fileSize: { type: integer, minimum: 1 }
        objectPath: { type: string, minLength: 1 }
        idempotencyKey: { type: string, minLength: 1 }
    ValidationException:
      type: object
      required: [id, runId, rowNumber, field, code, message, severity, status]
      properties:
        id: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        rowNumber: { type: integer }
        field: { type: string }
        code: { type: string }
        message: { type: string }
        severity:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [open, reviewed, waived]
        value:
          type: ["string", "null"]
    SummaryInput:
      type: object
      properties:
        forceRegenerate: { type: boolean, default: false }
    EvidenceSummary:
      type: object
      required: [id, runId, headline, overview, riskLevel, findings, generatedAt, model]
      properties:
        id: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        headline: { type: string }
        overview: { type: string }
        riskLevel:
          type: string
          enum: [low, medium, high, critical]
        findings:
          type: array
          items:
            type: object
            required: [title, detail, severity]
            properties:
              title: { type: string }
              detail: { type: string }
              severity:
                type: string
                enum: [low, medium, high, critical]
        generatedAt: { type: string, format: date-time }
        model: { type: string }
    ActionRequest:
      type: object
      required: [id, runId, actionType, title, rationale, status, requestedBy, requestedAt]
      properties:
        id: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        actionType:
          type: string
          enum: [request_correction, notify_owner, create_review_task]
        title: { type: string }
        rationale: { type: string }
        status:
          type: string
          enum: [requested, approved, rejected, running, completed, failed]
        requestedBy: { type: string }
        requestedAt: { type: string, format: date-time }
        decidedAt: { type: ["string", "null"], format: date-time }
        decisionNote: { type: ["string", "null"] }
        result: { type: ["string", "null"] }
    ActionRequestInput:
      type: object
      required: [runId, actionType, title, rationale]
      properties:
        runId: { type: string, format: uuid }
        actionType:
          type: string
          enum: [request_correction, notify_owner, create_review_task]
        title: { type: string, minLength: 1 }
        rationale: { type: string, minLength: 1 }
    ActionDecisionInput:
      type: object
      properties:
        note: { type: string }
    AuditEvent:
      type: object
      required: [id, action, entityType, entityId, actor, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        actor: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        createdAt: { type: string, format: date-time }
        metadata: { type: object, additionalProperties: true }
    OrganisationSettings:
      type: object
      required: [id, name, code, retentionDays, requireApproval]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        retentionDays: { type: integer, minimum: 1 }
        requireApproval: { type: boolean }
    SettingsUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        retentionDays: { type: integer, minimum: 1, maximum: 3650 }
        requireApproval: { type: boolean }
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1, maximum: 262144000 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
    InboundEventInput:
      type: object
      required: [eventId, organisationId, eventType, payload]
      properties:
        eventId: { type: string, minLength: 1 }
        organisationId: { type: string, format: uuid }
        eventType: { type: string, minLength: 1 }
        payload: { type: object, additionalProperties: true }
    InboundEventResponse:
      type: object
      required: [accepted, deduplicated]
      properties:
        accepted: { type: boolean }
        deduplicated: { type: boolean }
    JobInput:
      type: object
      required: [organisationId]
      properties:
        organisationId: { type: string, format: uuid }
        maxRuns: { type: integer, minimum: 1, maximum: 10, default: 3 }
    JobResponse:
      type: object
      required: [organisationId, claimedRunIds, processedCount]
      properties:
        organisationId: { type: string, format: uuid }
        claimedRunIds:
          type: array
          items: { type: string, format: uuid }
        processedCount: { type: integer }

